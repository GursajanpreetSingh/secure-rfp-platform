name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rfp
          POSTGRES_PASSWORD: rfp_dev_password
          POSTGRES_DB: rfp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rfp -d rfp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://rfp:rfp_dev_password@localhost:5432/rfp
      JWT_SECRET: ci-only-throwaway-secret-0123456789abcdefghijklmnop

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Apply migrations
        run: |
          uv run alembic upgrade head
          uv run alembic current

      - name: Tests
        run: uv run pytest -v
