services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rfp-db
    environment:
      POSTGRES_USER: rfp
      POSTGRES_PASSWORD: rfp_dev_password
      POSTGRES_DB: rfp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfp -d rfp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
