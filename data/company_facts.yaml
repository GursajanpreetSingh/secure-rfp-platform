architecture:
  regions: [India (Mumbai), EU (Frankfurt)]
  zones: [edge, application, data, management, backup]
  encryption:
    at_rest: AES-256
    mode: GCM
    in_transit: "TLS 1.3"
    key_management: envelope encryption with a dedicated key service
    key_rotation_days: 365
  components:
    - {
        name: Edge load balancer,
        layer: edge,
        purpose: Distributes incoming traffic and terminates TLS,
      }
    - {
        name: Web application firewall,
        layer: edge,
        purpose: Filters malicious requests before they reach the application,
      }
    - {
        name: Web front end,
        layer: application,
        purpose: Serves the browser interface,
      }
    - {
        name: API gateway,
        layer: application,
        purpose: Authenticates callers and routes requests to services,
      }
    - {
        name: Identity service,
        layer: application,
        purpose: Manages user accounts roles and sign-in,
      }
    - {
        name: Policy engine,
        layer: application,
        purpose: Decides which records each user may see,
      }
    - {
        name: Evidence service,
        layer: application,
        purpose: Stores and links compliance evidence to controls,
      }
    - {
        name: Report service,
        layer: application,
        purpose: Builds audit and compliance reports,
      }
    - {
        name: Notification service,
        layer: application,
        purpose: Sends email and in-app notifications,
      }
    - {
        name: Job scheduler,
        layer: application,
        purpose: Runs scheduled and background jobs,
      }
    - {
        name: Primary database,
        layer: data,
        purpose: Holds customer records and configuration,
      }
    - {
        name: Read replicas,
        layer: data,
        purpose: Serve read-heavy queries to reduce load on the primary,
      }
    - {
        name: Object store,
        layer: data,
        purpose: Holds uploaded files and generated reports,
      }
    - {
        name: Search index,
        layer: data,
        purpose: Supports full-text search across evidence,
      }
    - {
        name: Message queue,
        layer: data,
        purpose: Passes work between services reliably,
      }
    - {
        name: Key service,
        layer: management,
        purpose: Creates stores and rotates encryption keys,
      }
    - {
        name: Log pipeline,
        layer: management,
        purpose: Collects and retains security and application logs,
      }
    - {
        name: Metrics and alerting,
        layer: management,
        purpose: Tracks health and raises alerts,
      }
    - {
        name: Backup service,
        layer: backup,
        purpose: Takes daily backups and verifies restores,
      }

incident_response:
  severity_levels:
    - {
        level: SEV1,
        name: Critical,
        definition: Confirmed data breach or complete loss of service for all customers,
      }
    - {
        level: SEV2,
        name: High,
        definition: Major feature unavailable or partial loss of service for many customers,
      }
    - {
        level: SEV3,
        name: Medium,
        definition: Degraded performance or a minor feature unavailable,
      }
    - {
        level: SEV4,
        name: Low,
        definition: Cosmetic issue or a single-user problem with a workaround,
      }
  phases: [detection, triage, containment, eradication, recovery, review]
  roles: [incident commander, communications lead, technical lead, scribe]
